[project]
name = "quart"
version = "0.1.0"
description = "A-share mid/low-frequency quant research and signal platform"
requires-python = ">=3.12"
dependencies = [
    "akshare>=1.16",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=17.0",
    "duckdb>=1.0",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "httpx>=0.27",
    "rich>=13.7",
    "apscheduler>=3.10",
    "streamlit>=1.62.0",
    "plotly>=7.0.0",
    "gradio>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
research = [
    "pyqlib>=0.9.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quart"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
