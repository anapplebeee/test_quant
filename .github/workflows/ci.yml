name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check (non-blocking)
        # mypy 尚未清零，先作为信息性检查；修完后改为阻塞
        run: uv run mypy quart || true

      - name: Tests
        run: uv run pytest tests/ -q

      - name: Config smoke check
        # 配置结构错误必须在启动瞬间暴露，而不是等回测跑一小时
        run: uv run python -c "from quart.config import load_config; load_config(); print('config ok')"

  # 回测正确性闸门：随机基线必须与孪生参照收敛
  # 这是识别"引擎缺陷 vs 策略本身亏损"的关键回归信号
  correctness:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --group dev
      - name: 引擎正确性（随机基线 + 回测/实盘执行一致性）
        run: |
          uv run pytest tests/test_random_baseline.py \
                        tests/test_execution_parity.py \
                        tests/test_walkforward.py -q
      - name: 存储布局等价性（分区 vs 单文件）
        run: uv run pytest tests/test_store.py tests/test_store_partitioned.py -q
      - name: 实盘路径冒烟（委托计划可负担性）
        run: uv run pytest tests/test_pipeline_smoke.py tests/test_artifacts.py tests/test_task_api_safety.py -q
