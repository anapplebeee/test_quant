data:
  root: ./data
  adjust: qfq
  sleep_seconds: 0.35
  exclude_st: true
  exclude_star: true
  exclude_chinext: true
  # 次新股过滤（模拟路径剔除上市不满 N 个自然日的行情行；前视/涨跌幅限制缓解）
  min_list_days: 120

universe:
  default_index: "000300"
  # 数据刷新股票池：index（指数成分股）| mainboard（沪深主板全部）| all（全市场）
  mode: "mainboard"
  # 并发刷新线程数（1-32）。主板全量 ~3000 只，串行按 0.35s/只需 ~18 分钟，
  # 并发 8 可压到 3 分钟内。
  workers: 8

benchmark: "000300"

backtest:
  initial_cash: 1000000.0
  commission_rate: 0.00025
  commission_min: 5.0
  stamp_tax_rate: 0.0005
  transfer_fee_rate: 0.00001
  slippage_rate: 0.001
  impact_coef: 0.10
  # 日频执行价场景：open（默认）| vwap | close。后两者仅是 T+1 日内回测假设。
  execution_price_mode: open
  # 单笔回测/信号计划最多占近 5 日平均成交额的比例；超过部分保留为剩余意图。
  max_adv_participation: 0.05
  min_order_value: 1000.0

strategy:
  # 默认信号只使用经过成本检验的低频防御候选；不代表收益保证。
  name: lowvol_indz
  # 正式实盘信号白名单：进入本表的策略必须在 data/meta/admission_status.csv
  # 有 Admission Gate PASS 记录（测试强制校验）。2026-09-01 治理修正：
  # lowvol_indz 全区间绝对收益为正，但对同股票池等权基准超额为负、固定参数
  # WFA OOS 仅 CAGR ~1.78% / Sharpe ~0.28，未满足"稳定正超额"准入证据，
  # 从实盘白名单降级为 Paper 候选（见 paper_allowlist）。
  # 历史绝对收益不是晋级理由；晋级路径 = scripts/admission_gate.py 全项通过。
  live_allowlist: []
  # Paper 模拟盘候选白名单：允许生成 T+1 Paper 信号（人工确认、逐笔对账），
  # 禁止晋级真实券商报单。候选必须在准入台账中有评估记录（含 FAIL）。
  paper_allowlist:
    - lowvol_indz
  top_k: 10
  lookback_days: 60
  rebalance_days: 5
  regime_filter_days: 20
  use_regime_filter: true
  max_weight_pct: 0.15
  min_avg_amount: 50000000
  liquidity_days: 20
  # 按策略覆盖（优先于上面的全局值；前端回测中心亦可通过 CLI 覆盖）
  # 依据 2026-08-28 实测：低波策略换手成本吞噬全部 alpha（零成本 +24.4% vs 含成本 -30.9%）。
  # 换手频率扫描（累计/最大回撤/笔数）：5日 -31.7%/-42.2%/1779 → 20日 +2.1%/-18.5%/721
  #   → 30日 +31.2%/-19.5%/509 → 40日 +40.4%/-16.7%/379 → 60日 +38.2%/-23.7%/234。
  # 40 日为最优（收益最高、回撤最小）；60 日起信号衰减、回撤放大。
  # 2026-08-31 全市场复验后回退：top30/45d/rev0。
  #   完整 5409 只股票数据（模拟过滤后口径）下 CAGR 7.53% / Sharpe 0.69，
  #   2 倍成本压力仍为 CAGR 6.09% / Sharpe 0.57；优于 top50/60/rev0.3
  #   的 3.08% / 0.32。详见 reports/full_market_validation_2026-08-31.md。
  overrides:
    # 2026-08-31 研报移植验证（momentum_rotation, 2024-01~2026-08）：
    # R4 多因子打分分级择时 vs 原均线择时 → 超额年化 +5.61% vs -2.26%，卡玛 0.40 vs 0.21。
    # 详细见 quart/strategy/timing.py 模块注释（广发 125 技术指标择时，因子打分法）。
    momentum_rotation:
      regime_mode: score
      timing_levels: 3
      # 动量策略对换手不敏感（零成本也亏，属因子失效），保持原频率
      rebalance_days: 5
    # 研报路径动量研究入口：不在 live_allowlist，仅用于回测/WFA。
    # smooth 为带方向路径平滑度；正式入场前仍需与 RankMom/RemoveUpLimit 做 OOS 对比。
    momentum_path:
      momentum_mode: smooth
      lookback_days: 240
      momentum_skip_days: 0
      rebalance_days: 20
      top_k: 20
      max_weight_pct: 0.10
      regime_mode: score
      timing_levels: 3
    lowvol_composite:
      rebalance_days: 40
      top_k: 20
      rank_buffer: 0.5
    lowvol_indz:
      # R011 门禁胜出配置（2026-09-03；权威口径 run_backtest.py：全区间 2019-2026、
      # 3 万元、主板+中小板、全成本1x + 冲击成本 impact_coef 跟随配置 + 剔除质量
      # 黑名单 + 风控单票上限 25%）：CAGR 13.26% / Sharpe 0.94 / MDD -20.01%。
      # A/B（同权威口径，2019-2026）：旧默认(Top30/rev0.35/min5000w)=6.54%/0.58/
      # -20.51%  vs 本配置 13.26%/0.94/-20.01% —— 年化翻倍、Sharpe+62%、MDD 略降。
      # 注：MDD -20.01% 恰在 20% 边缘（非早期无冲击成本口径的 -17.38%）。
      # 待办：new_alpha_weight=0.3 与 timing_levels=2 为全样本调优值，
      #   尚未滚动样本外(WFA)验证，验证前不作为正式参数定稿。
      rebalance_days: 45
      top_k: 8
      rank_buffer: 0.5
      industry_z: true
      rev_weight: 0.0
      # R010 3 个正交因子独立权重（0.3×3 等价于旧 new_alpha_weight=0.3 定稿值）
      gap_fill_weight: 0.3
      amount_concen_weight: 0.3
      vol_asym_weight: 0.3
      min_avg_amount: 20000000
      max_weight_pct: 0.4
      use_regime_filter: true
      regime_mode: score
      timing_levels: 2
    # 双均线策略每日换仓为成本杀手，默认降频到 5 日
    dual_ma:
      rebalance_days: 5
    # 热点龙头轮动(2026-09-04 移植 ht_* 研究至正式引擎)。
    # 默认=实证最优单板块 Top1 + 3 票 + 10% 硬止损。
    # 注意：平台风控单票上限 25% 会约束集中度(3 票 ~33%/票会被削到 25%)，
    # 属平台治理对"集中追热点"的合规降噪，非策略 bug。
    hot_rotation:
      selector: momentum        # momentum 免外部依赖可即跑；ml_score 需 reports/ht_ml_scores.csv
      freq: ME
      hot_k: 1
      hot_rank: 1
      per_sector: 3
      n_leaders: 3
      stop_loss: 0.10
      momentum_days: 5
    # ETF 动量轮动(2026-09-04 移植 etf.py 至正式策略)：真实 ETF 标的，
    # 需以 9 只 ETF 小 panel 喂引擎(scripts/backtest_etf.py)，不入 A 股全市场流程。
    # 默认参数对齐原 etf.py：0.6×20日 + 0.4×60日动量、>MA60、每周调仓 Top2、-8%止损、
    # 组合回撤-12%半仓30日。实证(指数版 2014-2026)年化≈7.6% 仅小幅超沪深300、不敌等权，
    # 仅回测研究，不入 allowlist。
    etf_momentum:
      risk_etfs: "510300,510500,159915,588000,512890,518880,159920,513500"
      defense_etf: "511010"
      top_n: 2
      mom_short_days: 20
      mom_long_days: 60
      short_weight: 0.6
      ma_window: 60
      stop_loss: 0.08
      port_dd_limit: 0.12
      half_mode_days: 30
    # 小市值多因子月度轮动(RESEARCH-015 胜出 H5, 2026-09-04)。权威口径
    # (2019-2026/3万/主板+创业+科创/全成本1x/黑名单158只)：CAGR 30.88%/Sharpe 1.18/
    # MDD -35.05%/终值 233,078；vs 同池等权 +12.8pp、vs 沪深300 +28.2pp。
    # 红线：MDD -35% 不满足 -20%，status=研究不入 allowlist。
    # 分年度除 2023(-8.9%) 全正；成本 0-3x = 39.1/30.9/22.7/13.9 平滑衰减。
    # 依赖 data/factors/fundamental_daily*.parquet + financials.parquet(PIT)。
    small_value:
      n: 10
      score_top: 60
      use_score: true
      mcap_min: 1500000000      # 15 亿
      mcap_max: 6000000000      # 60 亿
      price_min: 3.0
      price_max: 25.0
      rev_min: 300000000
      min_list_days: 730
      min_avg_amount: 50000000
      recency_st_days: 250
      max_limit_up60: 3
      max_ret20: 0.40
      mcap_floor60: 1200000000  # 12 亿
      use_calendar_flat: true
      reb_day: 1
      buf_mult: 0.0
      max_weight_pct: 0.15
  min_price: 2.0

risk:
  max_position_pct: 0.25
  max_daily_loss_pct: 0.05

manual_trading:
  enabled: true
  account_name: manual
  database: ./state/trading.db
  auto_migrate_holdings: true

notify:
  dingtalk_webhook: ""
  dingtalk_secret: ""
  wecom_webhook: ""
  wecom_secret: ""
  wechat_pushplus_token: ""
